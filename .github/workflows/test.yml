name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Install Node.js and NPM
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: npm

      - name: npm install
        run: |
          npm install

      - name: ci checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm run ci

      - name: package app for smoke test
        run: npm run package:dir

      - name: packaged smoke test
        if: runner.os != 'Linux'
        run: npm run test:smoke

      - name: packaged smoke test (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:smoke
