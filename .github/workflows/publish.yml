name: Publish

# Pushing a version tag (v1.2.3, matching release/app/package.json) runs the
# full test suite, then builds every platform and uploads the installers to a
# draft GitHub release. macOS builds are signed and notarized only when the
# signing secrets exist; otherwise they are unsigned and the log says so.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux

    env:
      # Each platform sees only its own signing secrets.
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.CSC_KEY_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      WIN_CSC_LINK: ${{ matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
      WIN_CSC_KEY_PASSWORD: ${{ matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js and NPM
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./release/app/package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match release/app/package.json version $version"
            exit 1
          fi

      - name: npm ci
        run: npm ci

      - name: Decide signing and notarization
        run: npx ts-node ./.erb/scripts/release-signing.ts

      - name: Build
        run: npm run build

      - name: Package and upload to a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder build --${{ matrix.platform }} --publish always
